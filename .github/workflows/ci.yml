name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: approval-queue UI
        working-directory: ui
        run: npm ci && npm test && npm run build && npm run build:embed

  # The extraction eval is the regression gate: it exits non-zero above 0% hallucination.
  # It calls a real model, so it runs only when the LLM_API_KEY secret is configured.
  eval:
    runs-on: ubuntu-latest
    needs: test
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
    steps:
      - uses: actions/checkout@v4
        if: env.LLM_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.LLM_API_KEY != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.LLM_API_KEY != ''
      - run: npm run eval
        if: env.LLM_API_KEY != ''
      - run: echo "LLM_API_KEY is not set; skipping the hallucination gate."
        if: env.LLM_API_KEY == ''
